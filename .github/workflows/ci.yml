name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Windows runs are slow, so they are not part of push/PR runs. Start them by hand from
  # Actions -> CI -> "Run workflow" (or `gh workflow run ci.yml --ref <branch>`).
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # push / pull_request -> Ubuntu and macOS; manual run (workflow_dispatch) -> Windows.
        # (The env context is not available in strategy, so the lists are written inline.)
        os: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '["windows-latest"]'
          || '["ubuntu-latest", "macos-latest"]') }}
        # Lowest supported version (package.json engines) and current LTS.
        node: ['22.12.0', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          # The README translation check reads when README.md last changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Exits 1 when src/ has a dependency cycle (dep-health.config.json sets the gate).
      - run: npm run check:cycles
      - run: npm test
      - name: Build and package smoke test
        run: npm run test:pack

  # The browser tests are slower and need a browser, so they are their own job.
  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # push / pull_request -> Ubuntu and macOS; manual run (workflow_dispatch) -> Windows.
        # (The env context is not available in strategy, so the lists are written inline.)
        os: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '["windows-latest"]'
          || '["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      # --with-deps installs the system libraries Chromium needs on Linux; on Windows and macOS
      # there are none to install and it only downloads the browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
